# Pings the deployed service on Render so the instance stays warm (free tier sleep).
# Set repository secret USER_SERVICE_RENDER_URL to your Render HTTPS URL, e.g.
#   https://eventflow-user-service-xxxx.onrender.com
# No trailing slash. If this repo only contains the user service, you can rename the
# secret to RENDER_SERVICE_URL and replace ${{ secrets.USER_SERVICE_RENDER_URL }} below.

name: Keep alive — user service

on:
  schedule:
    # Every 14 minutes (UTC). Render free tier wakes on HTTP traffic.
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        env:
          BASE_URL: ${{ secrets.USER_SERVICE_RENDER_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "Set GitHub secret USER_SERVICE_RENDER_URL to your Render service URL (https://...onrender.com)"
            exit 1
          fi
          curl -fsSL --max-time 30 "${BASE_URL}/api/health" | head -c 500
          echo ""
          echo "OK — user service responded"
